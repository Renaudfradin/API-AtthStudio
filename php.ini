; Remplace le php.ini Railpack (memory_limit = -1).
; Chaque thread FrankenPHP garde son pic mémoire : sans plafond, la RAM au repos est facturée.
; 256M laisse passer un upload de 100M plus le boot Laravel.
; Avec 2 threads (Caddyfile), le plafond process est 512M.
memory_limit = 256M

upload_max_filesize = 100M
post_max_size = 100M

; Le php.ini Railpack désactive cette fonctionnalité (CVE-2026-109619).
; Ce fichier le remplace, donc le réglage doit être repris ici.
session.upload_progress.enabled = Off
